name: macOS Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: bash build/security_audit.sh
      - run: ./build/build_mac.sh
      - run: .venv/bin/python -m pytest --cov=. --cov-report=xml tests/
      - uses: actions/upload-artifact@v4
        with:
          name: LinkPilot-dmg
          path: dist/LinkPilot.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-macos
          path: coverage.xml
