name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: bash build/security_audit.sh
      - run: ./build/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LinkPilot-macOS
          path: dist/LinkPilot.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: choco install innosetup -y
      - run: python -m venv .venv
      - shell: bash
        run: bash build/security_audit.sh
      - run: build\build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: LinkPilot-Windows-exe
          path: dist/LinkPilot-Setup.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
      - run: git log --oneline $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD^)..HEAD > CHANGELOG_RELEASE.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG_RELEASE.txt
          files: |
            LinkPilot-macOS/LinkPilot.dmg
            LinkPilot-Windows-exe/LinkPilot-Setup.exe
