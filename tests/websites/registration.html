<!doctype html>
<title>Create Account</title>
<h1>Create Account</h1>
<form action="success.html">
  <label>First name <input name="first_name" placeholder="First name" required></label>
  <label>Last name <input name="last_name" placeholder="Last name" required></label>
  <label>Email <input type="email" name="email" placeholder="Email" required></label>
  <label>Phone <input name="phone" placeholder="Phone"></label>
  <label>Password <input type="password" name="password" placeholder="Password" required></label>
  <button>Create account</button>
</form>
